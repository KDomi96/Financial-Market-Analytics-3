[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-market-analytics-3"
version = "0.1.0"
description = "Postgraduate technology-stock pair trading research project."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "python-multipart>=0.0.33",
    "scikit-learn>=1.9.1",
    "statsmodels>=0.15.0",
    "streamlit>=1.66.1",
    "torch>=2.0",
    "transformers>=5.22.1",
    "uvicorn>=0.54.0",
    "vadersentiment>=3.3.2",
    "yfinance>=1.7.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["market_analytics*"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "nbconvert>=7.17.2",
]

